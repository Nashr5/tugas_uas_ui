services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./htdocs:/var/www/html
      - php-vendor-v2:/var/www/html/vendor
      - php-data:/var/www/data
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-app}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_secret}
      # Konfigurasi Google Authenticator (TOTP)
      GOOGLE2FA_ISSUER: ${GOOGLE2FA_ISSUER:-Belikita}
      GOOGLE2FA_ACCOUNT: ${GOOGLE2FA_ACCOUNT:-admin@belikita.com}
      GOOGLE2FA_SECRET: ${GOOGLE2FA_SECRET:-}
      # Konfigurasi SMTP Email (OTP Lupa Kata Sandi)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@belikita.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Belikita Support}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./htdocs:/var/www/html:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - php
    networks:
      - app-network

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - ./databases:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_secret} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    ports:
      - "8084:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

volumes:
  php-data:
  php-vendor-v2:
  caddy-data:
  caddy-config:

networks:
  app-network: